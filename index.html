<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countries &amp; Capitals</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Learn all countries of the world and their capitals." />
    <script>
      // Apply the saved theme before the first paint (avoids a light/dark flash).
      try { var t = localStorage.getItem('country-capitals:theme'); if (t) document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
